services:
  ecosort-api:
    build: .
    image: ecosort-api:local
    container_name: ecosort-api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ECOSORT_STORAGE: ${ECOSORT_STORAGE:-local}
      ECOSORT_DATA_FILE: /app/data/ecosort.json
      AIO_USERNAME: ${AIO_USERNAME:-}
      AIO_KEY: ${AIO_KEY:-}
      AIO_FEED_PREFIX: ${AIO_FEED_PREFIX:-}
      ECOSORT_AI_THRESHOLD: ${ECOSORT_AI_THRESHOLD:-0.75}
    volumes:
      - ecosort-data:/app/data
    restart: unless-stopped

volumes:
  ecosort-data:

